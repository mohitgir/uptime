[build]
  publish = "."
  command = "node build-env.mjs"

[build.environment]
  # Supabase URL + anon key are public by design (they ship to the browser); only RESEND_API_KEY stays scanned.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"

[[redirects]]
  from = "/"
  to = "/Uptime.dc.html"
  status = 200

[[redirects]]
  from = "/status/:slug"
  to = "/Status.dc.html?p=:slug"
  status = 200

[[redirects]]
  from = "/status"
  to = "/Status.dc.html"
  status = 200
